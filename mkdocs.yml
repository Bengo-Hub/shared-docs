site_name: Codevertex Africa — Platform Documentation
site_description: Ecosystem-wide architecture, integration, and engineering-standards documentation for the Codevertex Africa microservices platform.
site_author: Codevertex Africa
site_url: https://bengo-hub.github.io/shared-docs/
repo_url: https://github.com/Bengo-Hub/shared-docs
repo_name: Bengo-Hub/shared-docs
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      fallback_to_build_date: true
      type: date

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Changelog: changelog.md
  - User Guide:
      - user-guide/index.md
      - Platform Overview: user-guide/platform-overview.md
      - Getting Started: user-guide/getting-started.md
      - Subscriptions & Billing: user-guide/subscriptions-and-billing.md
  - Technical Guide:
      - Architecture:
          - architecture/index.md
          - Microservice Architecture (master doc): architecture/microservice-architecture.md
          - Trinity Authorization Pattern: architecture/trinity-authorization-pattern.md
          - Event Architecture (NATS/JetStream): architecture/event-architecture.md
          - SSO Integration Guide: architecture/sso-integration-guide.md
          - Login Flow Contract: architecture/login-flow-contract.md
          - Subscription Gating Guide: architecture/subscription-gating-guide.md
          - Cross-Service Data Ownership: architecture/cross-service-data-ownership.md
          - Go Backend — Ent + Atlas Migrations: architecture/go-backend-ent-atlas-migrations.md
          - DevOps-K8s Ingress & CORS: architecture/devops-k8s-ingress-cors.md
      - Platform Engineering Standards:
          - platform-standards/index.md
          - Engineering Principles: platform-standards/engineering-principles.md
          - Webhooks vs Polling: platform-standards/webhooks-vs-polling.md
          - Connection Pooling & PgBouncer: platform-standards/connection-pooling-pgbouncer.md
          - Read Replicas: platform-standards/read-replicas.md
          - Caching: platform-standards/caching.md
          - Idempotency & the Outbox Pattern: platform-standards/idempotency-and-outbox.md
          - Resilience — Circuit Breakers & Retries: platform-standards/resilience-and-retries.md
          - Rate Limiting: platform-standards/rate-limiting.md
          - Service-to-Service (S2S) Conventions: platform-standards/s2s-conventions.md
          - Swagger/OpenAPI Docs Gating: platform-standards/swagger-docs-gating.md
          - Secrets Management: platform-standards/secrets-management.md
          - Observability: platform-standards/observability.md
          - AI Integrations & pgvector: platform-standards/ai-and-pgvector.md
          - N+1 Queries & Preloading: platform-standards/n-plus-one-queries.md
      - Integrations:
          - integrations/index.md
          - Payment Workflow (hub): integrations/payment-workflow.md
          - M-Pesa (Daraja) Reference: integrations/mpesa-integration-reference.md
          - Paystack Reference: integrations/paystack-integration-reference.md
          - Paystack Callback Page: integrations/paystack-callback-page.md
          - Notifications REST API: integrations/notifications-rest-api-integration.md
          - Finance Integration Map: integrations/finance-integration-map.md
          - eTIMS API Quickstart: integrations/etims-api.md
          - Email Hosting: integrations/email-hosting.md
          - Developer Portal — State & Roadmap: integrations/developer-portal.md
