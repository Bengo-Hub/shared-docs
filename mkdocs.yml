      - Inventory/Ordering Audit TODOs (2026-06-25): history/inventory-ordering-audit-todos.md
      - POS QA Remediation Sprint (2026-07-06): history/pos-qa-remediation-2026-07.md
      - WhatsApp Provider Evaluation (2026-06): history/whatsapp-provider-evaluation.md
